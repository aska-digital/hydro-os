# Jarvis speech-to-text settings (used with: voxtype -c this-file transcribe x.wav)
state_file = "disabled"

[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60
pause_media = false

[whisper]
# Multilingual base model: English, Urdu, Arabic. Auto-detects the language.
model = "base"
language = "auto"
translate = false

[output]
mode = "clipboard"
fallback_to_clipboard = true

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false
